name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall -q deckhand tests docs

  package:
    name: Build and install the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --wheel
      - name: Install it and run the console script
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-deps dist/*.whl
          /tmp/venv/bin/deckhand mcp status

  tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, test_mcp, test_install, test_resilience, test_anim, test_autoswitch, test_features, test_nowplaying, test_timer, test_buttons, test_widgets_options]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: System libraries (Qt offscreen, hidapi, D-Bus, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libhidapi-libusb0 dbus fonts-dejavu-core

      - name: Python dependencies
        run: pip install -r requirements.txt

      - name: Run ${{ matrix.suite }}
        # a private D-Bus session bus, because the auto-switch bridge talks D-Bus
        run: dbus-run-session -- python3 -u tests/${{ matrix.suite }}.py
